[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion"
version = "0.3.0"
description = "Behavioral Attack Surveillance & Threat Isolation Operating Network (Sentinel Core)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Abhinav" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
bastion = "bastion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
